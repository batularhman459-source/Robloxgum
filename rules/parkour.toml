# Parkour movement tuning. Flowing momentum: auto-sprint at baseSpeed, chaining moves builds speed up to
# maxSpeed, breaking the flow loses it. Distances in studs, times in seconds. Starting values: tune in
# playtests and note the reason in [source] when you change one.
# Jump height and gravity live in movement.toml (shared with the map checks).

[speed]
base = 27               # auto-sprint speed when not chaining (20 -> 24 -> 27; designer 2026-11-18: faster, then "a bit more")
max = 45                # cap from chaining moves (34 -> 40 -> 45)
flowGrace = 1.2         # seconds after the last move before speed starts falling back
decayPerSecond = 6      # how fast speed falls back towards base after flowGrace
bonkFactor = 0.55       # running straight into a wall keeps this share of speed

[gain]
# Speed added when a move is done (up to speed.max). Repeating the SAME move in a row gains less:
# each repeat multiplies the gain by repeatFactor, so flow means mixing moves.
slide = 2
wallRun = 3
wallJump = 3
landRoll = 2
doubleJump = 1
slideJump = 0           # Space during a slide: no speed gain (designer 2026-11-18: remove the huge boost; was 3)
slideCancel = 0         # C again during a slide: no speed gain (designer 2026-11-18: no boost from cancelling)
vault = 0               # a toolbox vault: no speed gain (designer 2026-11-18: no boost from vaulting; was 2)
repeatFactor = 0.5
maxRefresh = 3          # the same move this many times in a row still keeps the flow alive; more
                        # repeats stop refreshing flowGrace, so spamming one move decays back to base

[jump]
doubleJumpHeight = 5    # second jump in the air
airJumps = 1            # jumps allowed in the air (double jump = 1)
coyoteTime = 0.12       # can still jump this long after running off an edge
jumpBuffer = 0.12       # a jump pressed this early before landing still happens

[slide]
duration = 0.75         # the burst decays back to the sprint speed over this long (on flat ground)
minSpeed = 22           # slower than this and slide does nothing; a slide this slow ends (uphill). Was 16: with the
                        # 27 sprint an uphill slide never got that slow, so it never ended early (2026-11-18)
height = 2.5            # body height while sliding (fits under gaps this low + margin)
cooldown = 0.8
burstSpeed = 60         # top slide speed, reached burstRise seconds after the press
burstRise = 0.06        # eases up to burstSpeed this fast (no single-frame snap)
slopeAccel = 60         # studs/s^2 gained per unit of downhill steepness (sin of the slope, along the slide)
slopeBonusDecay = 0.5   # seconds: speed won on a slope fades this fast once it flattens out
keepDownhill = 0.1      # past duration, a downhill at least this steep keeps the slide going
maxDuration = 2.5       # no slide lasts longer, even down a long slope
maxSpeed = 75           # slide speed cap (also on slopes)
cancelAfter = 0.1       # a cancel works this long into the slide (no tap-tap spam of the burst)
jumpHeight = 7.2        # Space mid-slide: the slide jump's height (no forward boost: sprint speed + any downhill speed)
minHip = 0.1            # lowest hip height used while sliding
clearance = 0.1         # extra room kept between the sliding body top and slide.height
gapMargin = 0.5         # a gap must be this much taller than slide.height to count as slide-able

[wallRun]
minSpeed = 16           # need at least this speed to start
maxDuration = 1.2       # then you drop off
gravityFactor = 0.1     # gravity while wall running, share of normal (0.25 hit the floor after 0.5 s)
entryUpSpeed = 6        # upward speed is capped to this when a wall run starts (no launching up the wall)
maxSlideDownSpeed = 8   # falling speed along the wall never gets faster than this
reach = 2.5             # wall must be this close to the body side
maxAngle = 50           # degrees between run direction and the wall
minHeight = 3.5         # must be at least this far above the ground to start (2.5 started too low)
sameWallCooldown = 0.6  # can't restart on the same wall right after leaving it

[wallJump]
height = 6              # jump height off a wall
push = 24               # sideways speed away from the wall
allowBurst = 1          # 1 = run speed + push may briefly go over speed.max (punchy burst), 0 = clamp to max

[landing]
safeHeight = 12         # falls up to this cost nothing
rollWindow = 0.25       # press slide this long before landing to roll
rollMaxHeight = 30      # a roll can save falls up to this (matches movement.toml maxSafeFall)
hardSpeedFactor = 0.5   # hard landing keeps this share of speed
hardStun = 0.35         # seconds of no control after a hard landing

[vaultChain]
# Vaulting again soon after a vault builds speed (designer 2026-11-18): the first vault adds nothing (gain.vault),
# each next vault within `window` seconds of the last adds `step`, up to `cap` from one chain.
window = 2.0
step = 1.5
cap = 6

[source]
speed = "game rule: base above Roblox default 16 because auto-sprint; 20/34 -> 24/40 -> 27/45 on 2026-11-18 (designer: about 20% faster, then a bit more)"
gain = "game rule: starting values; maxRefresh added after playtest 2026-11-15 (slide spam held 31.5 forever); vault added 2026-11-17 (designer: vault keeps momentum); slideJump added 2026-11-17 (designer slide spec); slideCancel added 2026-11-18; slideCancel, vault and slideJump set to 0 the same day (designer: no speed boost from cancelling or vaulting)"
jump = "game rule: starting values; coyote/buffer are common platformer defaults"
slide = "game rule; minHip/clearance/gapMargin for the real slide (M2); designer slide spec 2026-11-17: burst 55 (60 from 2026-11-18, with the faster sprint) decaying over ~0.75 s, slope momentum, trigger above 16, cooldown 0.8, Space = jump-boost; jumpHeight = movement.jumpHeight; cancelAfter 2026-11-18 (slide cancel)"
wallRun = "game rule; gravityFactor, minHeight, entryUpSpeed, maxSlideDownSpeed tuned in playtest 2026-11-15"
wallJump = "game rule: starting values; allowBurst = 1 chosen by the designer 2026-11-15"
landing = "game rule: rollMaxHeight = movement.toml maxSafeFall"
vaultChain = "designer 2026-11-18: from the 2nd vault within 2 s, +1.5 each, up to +6"
