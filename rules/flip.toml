# The double jump's frontflip (src/client/FlipFeel.luau). Designer 2026-11-18: "a frontflip with vfx and sound",
# picked a tuck flip, snappy (0.4 s), an air burst ring + a puff of air, a soft whoosh.
# Poses in R6 body angles, degrees (src/shared/R6Pose.luau: pitch + = lean forward, fwd + = swing forward, out + = away
# from the body). The flip turns the body about the torso centre: root pitch goes 0 -> 360 (one full forward turn).
# R6 legs have no knees, so the "tuck" swings the straight legs up toward the chest while the arms hug in.

[timing]
blendIn = 0.04          # seconds to fade the jump animation out at the start
blendOut = 0.06         # seconds to fade it back in at the end (the last key is standing again)

[[keys]]
t = 0.0
pose = {}
[[keys]]
t = 0.06
pose = { root = { pitch = 35 }, head = { pitch = 15 }, rleg = { fwd = 60 }, lleg = { fwd = 55 }, rarm = { fwd = 70, out = 10 }, larm = { fwd = 70, out = 10 } }
[[keys]]
t = 0.15
pose = { root = { pitch = 150 }, head = { pitch = 35 }, rleg = { fwd = 105 }, lleg = { fwd = 100 }, rarm = { fwd = 85, out = 15 }, larm = { fwd = 85, out = 15 } }
[[keys]]
t = 0.26
pose = { root = { pitch = 285 }, head = { pitch = 35 }, rleg = { fwd = 105 }, lleg = { fwd = 100 }, rarm = { fwd = 85, out = 15 }, larm = { fwd = 85, out = 15 } }
[[keys]]
t = 0.34
pose = { root = { pitch = 345 }, head = { pitch = 5 }, rleg = { fwd = 25 }, lleg = { fwd = 15 }, rarm = { fwd = -15, out = 45 }, larm = { fwd = -15, out = 45 } }
[[keys]]
t = 0.4
pose = { root = { pitch = 360 } }

[ring]
# The designer's own VFX pack (Anime / Shoot-01, inserted from their inventory 2026-11-18): an animated anime
# shockwave ring (4x4 flipbook). Designer 2026-11-18: "need better VFX, pick one fitting from my packs" - picked over
# Wind-01/02 (soft smoke, rejected before) and Hit-03 (reads as a hit). Laid flat under the feet: emitted straight down
# with VelocityPerpendicular, so its face lies in the ground plane; not locked to the body, so it stays where you kicked
# off the air. Values are the pack's own except scale.
texture = "rbxassetid://16477162837"
life = 0.5
sizeStart = 0.44        # studs (pack: 0.44 -> 3.75 at half life -> 5.12)
sizeMid = 3.75
sizeEnd = 5.12
scale = 1.3             # ours: a bit wider than the pack's, to frame the R6 body
brightness = 5
lightEmission = 1
zOffset = 1

[sound]
# Picked by the designer by ear 2026-11-18 from a 6-sound audition ("not loud, subtle, nice to hear, satisfying"),
# after the nylon whoosh. Probed: IsLoaded true, TimeLength 0.67 s.
id = 9113702967         # Candles Blow Out Airy Breath Exhale 1 (ProSoundEffects): a soft airy exhale
volume = 0.3            # quiet on purpose
pitchMin = 0.95         # a little variation each flip
pitchMax = 1.08
rollOff = 60

[source]
timing = "designer 2026-11-18: snappy 0.4 s tuck frontflip"
keys = "designer 2026-11-18 picked a tuck flip; keys set on the avatar in Studio"
ring = "the designer's VFX pack Anime/Shoot-01, values read from the instance in Studio 2026-11-18; picked as the one fitting effect"
sound = "designer 2026-11-18: picked by ear from Studio auditions; soft nylon whoosh, then the soft airy exhale (subtle, satisfying)"
